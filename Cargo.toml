[package]
name = "silo"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "deny"

[dependencies]
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "8.0.0"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
toml = "1.1.4"
