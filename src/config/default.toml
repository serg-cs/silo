### Silo configuration. All settings are optional; omitted settings use defaults.
### Project settings in `.silo.toml` override this file.

### Use a custom Dockerfile instead of the built-in image.
# image.dockerfile = "/path/to/Dockerfile"

### Container resources. Omit either setting to use Apple container's default.
# container.cpus = 4
# container.memory = "4G"

### Shell for the built-in image: "bash", "zsh", "fish", or "nu".
### When omitted, use a supported host $SHELL and fall back to Zsh.
# shell = "zsh"

### Prevent the container from modifying the project's Git metadata.
read_only_git = true

### Targets use `./` for the project directory, `~/` for the container home,
### or `/` for an absolute container path. Host mounts default to read-only.
[mounts.host]
# docs = { source = "~/docs", target = "~/docs" }
# output = { source = "./output", target = "/output", writable = true }

### Project mounts are writable Silo-managed state private to one project and
### survive automatic container removal after the final session exits.
[mounts.project]
# cargo = { target = "~/.cargo" }
# cargo-target = { target = "./target" }

### Shared mounts are durable writable state reused by every project with the
### same name. Managed mounts are skipped for custom images.
[mounts.shared]
# codex = { target = "~/.codex" }

### Run shortcuts as `silo <name> [args...]`.
[quick]
# name = ["command"]
