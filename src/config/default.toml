# silo configuration.
#
# All keys are optional; when a key is absent, the built-in default applies.
#
# Every container shares the discovered project directory (mounted read-write
# at /home/silo/<project-name>). Silo uses the nearest ancestor containing a
# `.silo.toml` file, otherwise the nearest ancestor containing a `.git`
# directory, otherwise the current directory. The `.silo.toml` file is only a
# project marker; settings continue to come from this config file.
#
# The optional read-only `.git` and the `[[shared]]` mounts are applied on top
# of the project directory. A project container stays running after its last
# session. Run `silo stop` to stop and delete it. Image rebuilds and changes to
# mount entries or read_only_git take effect after `silo stop` and the next run.

[image]
# Dockerfile that defines the image `silo image build` builds and `silo run`
# runs. When unset, the built-in silo image is used.
# dockerfile = "/path/to/your/Dockerfile"

# Mount this project's `.git` directory read-only in the container, so tools
# inside it cannot modify version control state (history, refs, staging
# area, config). The directory stays readable; only writes are blocked. Set
# to false to let tools in the container manage the repository.
read_only_git = true

# [[shared]]
# Shared mounts applied when a project container is created, on top of the
# project directory. Each entry mounts a path on this machine (`source`)
# into the container at `target`, with a `permission` of `read-only` (the
# default) or `read-write`:
#
#   source = "~/.ssh"             # host path; `~` means your home directory
#   target = "/home/silo/.ssh"    # absolute path inside the container
#   permission = "read-only"      # or "read-write" to let tools write through
#
# The source must be an absolute path or a `~`-prefixed path like `~/notes`
# (a bare `~` is your home directory; `~user` paths are not supported), and
# must exist when a container is created (for shared runs: at `silo stop` +
# the next `silo run`), or the run fails. Mounts are passed to
# the container CLI in this order: project directory, `.git` (read-only),
# shared mounts — when two mounts share a target, the last one passed wins.

[quick]
# Quick commands: `silo <name>` runs the command inside the container, like
# `silo run -- <command>` without the boilerplate. The key is what you type;
# the value is the command (and any fixed arguments) executed inside the
# container. Arguments you pass on the command line are appended to it.
#
#   codex = ["codex"]
#   cx    = ["codex", "--model", "compact"]
#
# A name must not collide with a built-in command (`run`, `stop`, `image`, `help`)
# and must not start with `-`: the built-in command always wins, and flag-
# shaped tokens are reserved for silo's own options, so such a quick command
# could never run. Unusable names are reported as a warning when silo runs.
