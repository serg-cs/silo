### Silo configuration. All settings are optional; omitted settings use defaults.
### Project settings in `.silo.toml` override this file.

### Use a custom Dockerfile instead of the built-in image.
# image.dockerfile = "/path/to/Dockerfile"

### Prevent the container from modifying the project's Git metadata.
read_only_git = true

### Mount additional host paths (`permission` defaults to "read-only").
# shared = [{ source = "/path/on/host", target = "/path/in/container", permission = "read-write" }]

### Run shortcuts as `silo <name> [args...]`.
[quick]
# name = ["command"]
